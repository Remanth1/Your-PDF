version: '3.8'
services:
  redis:
    image: redis:7
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_USER: example
      POSTGRES_DB: fileforge
    ports:
      - '5432:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data
  worker:
    build: ./apps/worker
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://example:example@postgres:5432/fileforge
    depends_on:
      - redis
      - postgres
volumes:
  redis-data:
  pg-data:
